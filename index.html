<!-- HTML5 doctype declaration -->
<!DOCTYPE html>
<html lang="en">

<head>
  <!-- Meta tags for character set and viewport -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Favicon link -->
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon.svg">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@500;700;800&display=swap" rel="stylesheet">
  <!-- External stylesheet link -->
  <link rel="stylesheet" href="style.css">

  <!-- Page title -->
  <title>Results Summary Component</title>
</head>

<body>
  <!-- Main content container -->
  <main>

    <!-- Section 1 - Your Result -->
    <section class="part1">
      <h1>Your Result</h1>
      <div class="circle"><span>76</span>
        <p> of 100</p>
      </div>
      <h2>Great</h2>
      <p>You scored higher than 65% of the people who have taken these tests.</p>
    </section>

    <!-- Section 2 - Summary -->
    <section class="part2">
      <h2>Summary</h2>
      <div class="container">

        <!-- Subsection 1 - Reaction -->
        <div class="summary-item summary-item--reaction">
          <div class="name">
            <img src="./assets/images/icon-reaction.svg" alt="">
            <p>Reaction</p>
          </div>
          <div class="score">
            80
            <span>/100</span>
          </div>
        </div>

        <!-- Subsection 2 - Memory -->
        <div class="summary-item summary-item--memory">
          <div class="name">
            <img src="./assets/images/icon-memory.svg" alt="">
            <p>Memory</p>
          </div>
          <div class="score">
            92
            <span>/100</span>
          </div>
        </div>

        <!-- Subsection 3 - Verbal -->
        <div class="summary-item summary-item--verbal">
          <div class="name">
            <img src="./assets/images/icon-verbal.svg" alt="">
            <p>Verbal</p>
          </div>
          <div class="score">
            61
            <span>/100</span>
          </div>
        </div>

        <!-- Subsection 4 - Visual -->
        <div class="summary-item summary-item--visual">
          <div class="name">
            <img src="./assets/images/icon-visual.svg" alt="">
            <p>Visual</p>
          </div>
          <div class="score">
            72
            <span>/100</span>
          </div>
        </div>

      </div>

      <!-- Continue button -->
      <button class="submit" type="button">
        Continue
      </button>
    </section>

  </main>
</body>

</html>
